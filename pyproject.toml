[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "world-engine"
version = "0.1.0"
description = "Deterministic, constraint-checked state ledger for AI agents: every intent validated against physical/financial rules, every attempt hash-chained into a tamper-evident audit trail."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]

# src layout: the kernel lives in src/world_engine/ (core/engine.py,
# ingestion/client.py, api/main.py). Thin shims at the repo root keep
# the old flat entry points (engine.py, ingest.py, app.py) working.
[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
world-ingest = "world_engine.ingestion.client:main"
world-import = "world_engine.ingestion.transcript:main"
world-server = "world_engine.api.main:serve"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
