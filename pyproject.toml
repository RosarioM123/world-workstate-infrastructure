[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "world-engine"
version = "0.1.0"
description = "Deterministic, constraint-checked state ledger for AI agents: every intent validated against physical/financial rules, every attempt hash-chained into a tamper-evident audit trail."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.168.0",
    "httpx==0.28.1",
]

# src layout: the kernel lives in src/world_engine/ (core/engine.py,
# ingestion/transcript.py, api/main.py). Thin shims at the repo root keep
# the old flat entry points (engine.py, import_transcript.py, app.py) working.
# The synthetic Rotterdam weather/port demo moved to
# examples/synthetic-logistics-demo/ and is not part of the package.
[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
world-import = "world_engine.ingestion.transcript:main"
world-server = "world_engine.api.main:serve"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["world_engine"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "def serve",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
