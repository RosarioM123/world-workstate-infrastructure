[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "world-engine"
dynamic = ["version"]
description = "WORLD: canonical, durable state for AI-agent work — a named JSON document with judged, hash-chained versions that survives handoffs between sessions, processes, and models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai-agents", "state", "ledger", "handoff"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# The `world` primitive core (world.core, world.invariants, world.cli) is
# dependency-free (stdlib only). The HTTP layer is opt-in via the `server`
# extra so `pip install .` stays minimal.
dependencies = []

[project.urls]
Homepage = "https://github.com/RosarioM123/world-workstate-infrastructure"
Repository = "https://github.com/RosarioM123/world-workstate-infrastructure.git"

[project.optional-dependencies]
server = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
]
test = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.168.0",
    "httpx==0.28.1",
    # fastapi mirrors the `server` extra: the server tests need it.
    "fastapi==0.141.1",
]

# src layout: the kernel lives in src/world_engine/ (core/engine.py,
# ingestion/transcript.py, api/main.py). Thin shims at the repo root keep
# the old flat entry points (engine.py, import_transcript.py, app.py) working.
# The synthetic Rotterdam weather/port demo moved to
# examples/synthetic-logistics-demo/ and is not part of the package.
[tool.setuptools.packages.find]
where = ["src"]

# Single source of truth for the version: src/world/__init__.py.
[tool.setuptools.dynamic]
version = { attr = "world.__version__" }

# PEP 561: ship the type markers so downstream mypy runs (examples/,
# experiments/, consumers) can analyze imports of world_engine/world_sdk.
[tool.setuptools.package-data]
"*" = ["py.typed"]

[project.scripts]
world = "world.cli:main"
world-import = "world_engine.ingestion.transcript:main"
world-server = "world_engine.api.main:serve"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["world_engine", "world_sdk", "world"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "def serve",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true

# uvicorn is an optional server dependency, imported lazily inside
# functions (cli.cmd_serve, api.main.serve). It has no type stubs;
# silence the import error rather than adding a hard dependency.
[[tool.mypy.overrides]]
module = "uvicorn.*"
ignore_missing_imports = true
