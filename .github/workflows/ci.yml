name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest tests/ -q --cov --cov-report=term-missing
      - name: Run examples tests
        run: python -m pytest examples/ -q

  # T-6: the independent C# verifier tests skip silently when dotnet
  # is absent, so a runner without dotnet would pass the suite while
  # the cross-language check never ran. This job fails unless the
  # four verifier tests actually pass (not skip). It runs once, on
  # 3.12, instead of once per matrix version.
  csharp-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -e ".[test]"
      - name: Run C# verifier tests (must run, not skip)
        run: |
          set -o pipefail
          python -m pytest tests/test_csharp_verifier.py -q --no-cov -p no:cacheprovider 2>&1 | tee csharp-verifier.log
          grep -q "4 passed" csharp-verifier.log || (echo "C# verifier tests were skipped: dotnet must be present on the runner" >&2 && exit 1)

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and lint tools
        # Pinned to the versions verified against the full lint scope:
        # ruff 0.16.9 flags DTZ001 on the intentionally naive datetimes
        # in test_naive_datetimes_rejected (their naivety is the point
        # of the test); 0.17.x accepts them, matching the Nov 3 cleanup
        # in cbcbc66. Bump deliberately and re-verify, never float.
        run: |
          pip install -e ".[test]"
          pip install ruff==0.17.5 mypy==2.4.1
      - name: Ruff lint
        run: ruff check src/ tests/ examples/ experiments/ spec/ tools/ demo/ app.py engine.py import_transcript.py
      - name: Ruff format check
        run: ruff format --check src/ tests/ examples/ experiments/ spec/ tools/ demo/ app.py engine.py import_transcript.py
      - name: Mypy type check
        run: mypy src/ examples/ experiments/ spec/ tools/ demo/ app.py engine.py import_transcript.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build landing page
        working-directory: frontend
        run: npm run build
      - name: Verify build output committed
        run: |
          test -f static/site/index.html || \
            (echo "frontend build output missing from static/site/" && exit 1)
