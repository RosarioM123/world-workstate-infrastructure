name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest tests/ -q --cov --cov-report=term-missing
      - name: Run examples tests
        run: python -m pytest examples/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and lint tools
        run: |
          pip install -e .
          pip install ruff mypy
      - name: Ruff lint
        run: ruff check src/ tests/ examples/ experiments/
      - name: Ruff format check
        run: ruff format --check src/ tests/ examples/ experiments/
      - name: Mypy type check
        run: mypy src/ examples/ experiments/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build landing page
        working-directory: frontend
        run: npm run build
      - name: Verify build output committed
        run: |
          test -f static/site/index.html || \
            (echo "frontend build output missing from static/site/" && exit 1)
